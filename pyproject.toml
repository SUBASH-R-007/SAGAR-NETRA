[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sagar-netra"
version = "0.1.0"
description = "SAGAR-NETRA: AI-powered underwater marine debris and anomaly detection from side-scan sonar imagery (SIH 2026, PS 26057)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team SAGAR-NETRA" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyxtf>=1.4",
    "pillow>=10.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
ml = [
    "ultralytics>=8.1",
    "torch>=2.1",
    "torchvision>=0.16",
    "opencv-python-headless>=4.8",
    # Pinned: newer albumentations/albucore pull stringzilla, which has no
    # Windows wheel and ICEs MSVC 2019 when built from source.
    "albumentations==1.4.15",
    "albucore==0.0.16",
    "grad-cam>=1.5",
]
geo = [
    "rasterio>=1.3",
]
api = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "reportlab>=4.0",
    "simplekml>=1.3",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.2",
]

[tool.setuptools.packages.find]
include = ["sonar_core*", "tridentnet*", "physicheck*", "geoscribe*", "api*", "edge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
